<!doctype html>
<html>
  <head>
    <title>Meu Projeto AR com Gestos</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gesture support para AR.js (pinch zoom + rotate) -->
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/gesture-detector.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/gesture-handler.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #ar-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: Arial;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Mensagem de ajuda (opcional) -->
    <div id="ar-overlay">
      <p>Pinch → Zoom<br />Dois dedos girando → Rotação</p>
      <p>Clique no coração → Toca som</p>
    </div>

    <!-- Áudio escondido -->
    <audio id="heart-sound" src="coracao-som.mp3" preload="auto"></audio>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      gesture-detector
    >
      <!-- Camera -->
      <a-entity camera></a-entity>

      <a-marker preset="hiro">
        <a-entity
          class="tocavel"
          gesture-handler="enabled: true"
          gltf-model="url(realistic_human_heart.glb)"
          scale="1 1 1"
          position="0 0 0"
          rotation="0 0 0"
          id="heart-model"
          eventsource
        >
        </a-entity>
      </a-marker>
    </a-scene>

    <script>
      // Aguarda o carregamento da cena
      document.addEventListener('DOMContentLoaded', function() {
        const audio = document.getElementById('heart-sound');
        const heartModel = document.getElementById('heart-model');
        
        // Toca o áudio quando clicar no modelo 3D
        if (heartModel) {
          heartModel.addEventListener('click', function() {
            if (audio.paused) {
              audio.play().catch(function(error) {
                console.log('Erro ao tocar áudio:', error);
              });
            } else {
              audio.pause();
              audio.currentTime = 0;
            }
          });
        }
      });
    </script>
  </body>
</html>
